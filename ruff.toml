# Ruff config
src = ["trading_backtester"]
exclude = [".git", ".venv", "__pycache__", "build", "dist"]
line-length = 80
target-version = "py312"

[lint]
select = [
    # Existing
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    # Strict type safety
    "ANN",    # flake8-annotations
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
    "ARG",    # flake8-unused-arguments
    "RET",    # flake8-return
]
ignore = [
    "ANN401",  # Allow Any - legitimate in heterogeneous data code
]
fixable = ["ALL"]

[lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG"]

[lint.flake8-annotations]
mypy-init-return = true
suppress-dummy-args = true

[format]
quote-style = "double"
indent-style = "space"