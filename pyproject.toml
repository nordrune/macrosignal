[project]
name = "macrosignal"
version = "1.0.0"
description = "Educational trading strategy backtester with a web dashboard"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]",
    "pandas",
    "yfinance",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "ty",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trading_backtester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.uv]
package = true
exclude-newer = "7 days"
